name: PR Labeler

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 基于变更路径自动打模块标签（module/*）
      - name: Label by path
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      # 基于 Conventional Commits 前缀补充类型标签（type/*）
      - name: Label by branch / commit prefix
        run: |
          PREFIX="${GITHUB_HEAD_REF%%/*}"
          case "$PREFIX" in
            feat|feature) T="type/feature" ;;
            fix|bugfix)   T="type/bug" ;;
            docs)         T="type/docs" ;;
            refactor)     T="type/refactor" ;;
            deps|dependabot) T="type/deps" ;;
            security)     T="type/security" ;;
            perf)         T="type/perf" ;;
            chore|build|ci) T="type/chore" ;;
            *)            T="" ;;
          esac
          if [ -n "$T" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label "$T" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
