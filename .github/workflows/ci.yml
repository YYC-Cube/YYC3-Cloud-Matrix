# ============================================================================
#  YYC³ CI Pipeline
#  YYC³ 本地多端推理矩阵数据库数据看盘 - 持续集成
# ============================================================================
#
# 触发条件:
#   - push 到 main/develop 分支
#   - 所有 Pull Request
#
# 阶段:
#   1. quality  → Lint + TypeScript 类型检查 + 依赖审计（audit 严重漏洞门禁）
#   2. test     → Vitest 单元测试 + 覆盖率报告
#   3. build    → Vite 生产构建（Pages 就绪包，供 pages-deploy.yml 复用发布）
#
# 部署链路: CI 全绿 → pages-deploy.yml（workflow_run 门禁触发）→ matrix.yyc3.vip
#
# 覆盖率门槛: 棘轮基线 45/44/31/44 (lines/functions/branches/statements)，
#   随测试补齐逐步上调至 80/70/80/80（见 vitest.config.ts）
# ============================================================================

name: YYC³ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  # ============================================================
  # 0. 质量门禁: Lint + 类型检查 + 依赖审计
  # ============================================================
  quality:
    name: Quality Gates
    # pin 24.04 规避 ubuntu-latest 于 2026-10-19 自动迁移 Ubuntu 26（保持迁移时点可控）
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # 依赖审计门禁：critical 直接失败；high 允许（当前 extract-zip
      # 修复版未发布，属 dev 工具链），待上游清零后可收紧为 --audit-level high
      - name: Dependency audit (critical gate)
        run: pnpm audit --audit-level critical

  # ============================================================
  # 1. 测试 + 覆盖率
  # ============================================================
  test:
    name: Test & Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --------------------------------------------------------
      # 单元测试 + JUnit 报告
      # --------------------------------------------------------
      - name: Run tests
        run: pnpm test:ci
        continue-on-error: false

      # --------------------------------------------------------
      # 覆盖率报告 (80% 门槛)
      # --------------------------------------------------------
      - name: Run coverage
        run: pnpm test:coverage
        continue-on-error: false

      # --------------------------------------------------------
      # 上传测试结果
      # --------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      # --------------------------------------------------------
      # PR 覆盖率评论 (仅 PR 触发)
      # --------------------------------------------------------
      - name: Coverage summary
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  # ============================================================
  # 2. 构建验证（GitHub Pages 就绪产物）
  #    - --base=/ ：自定义域名根路径部署 + 深链 404 回退可用
  #    - 404.html ：SPA 回退入口（GH Pages 对未知路径返回 404.html，
  #      路由器接管后渲染对应深链路由）
  #    - .nojekyll：跳过 Jekyll 处理，加速发布并支持下划线资源
  #    - 产物 pages-dist 由 pages-deploy.yml 在 CI 全绿后复用发布
  # ============================================================
  build:
    name: Build (Pages-ready)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [quality, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle (base=/)
        run: pnpm build:pages

      - name: Post-process for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # 部署完整性门禁：四要素缺一即失败，阻断坏产物向 Pages 扩散
      - name: Verify bundle integrity
        run: |
          for f in dist/index.html dist/404.html dist/.nojekyll public/CNAME dist/CNAME dist/manifest.json; do
            test -e "$f" || { echo "❌ 缺失部署关键文件: $f"; exit 1; }
          done
          test -n "$(ls dist/assets 2>/dev/null)" || { echo "❌ dist/assets 为空"; exit 1; }
          grep -q 'src="/assets/' dist/index.html || { echo "❌ index.html 资源路径非绝对（base=/ 未生效）"; exit 1; }
          echo "✅ 部署包完整性校验通过"

      - name: Upload Pages bundle
        uses: actions/upload-artifact@v7
        with:
          name: pages-dist
          path: dist/
          retention-days: 7
          # .nojekyll 为隐藏文件，默认会被排除导致部署校验失败
          include-hidden-files: true
